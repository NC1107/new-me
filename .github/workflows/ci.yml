name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Least privilege per job rather than whatever the repository default happens to be.
jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    # DB-backed handler tests refuse to run without TESTDB_URL, so this service is what
    # makes the job meaningful rather than merely green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newme
          # Per-run value: the database lives and dies inside this job, and a literal
          # would trip secret scanners on every future edit.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: newme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { echo 'These files need gofmt:'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
        env:
          TESTDB_URL: postgres://newme:ci-${{ github.run_id }}@localhost:5432/newme_test?sslmode=disable
          NEWME_APP_KEY: ci-test-key-0123456789

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned exactly: "stable" moves, and an upstream release could change what ships.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
      # SPM linking left check-in on a white launch screen; stay on CocoaPods.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=NEWME_APP_KEY=ci-key

  # A plain git diff instead of dorny/paths-filter: no third-party action to pin or trust,
  # and macOS minutes are only spent when iOS inputs really changed.
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has an all-zero "before"; treat unknown history as changed.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(app/(ios/|pubspec\.yaml$|pubspec\.lock$)|\.github/workflows/ci\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios-build:
    name: iOS build (no codesign)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      # Match release.yml: the runner's default Xcode lacks SDK symbols some plugins use.
      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --dart-define=NEWME_APP_KEY=ci-key
