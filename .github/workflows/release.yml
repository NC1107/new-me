name: Release

# Push to main cuts a version, publishes the server image, uploads an iOS build to
# TestFlight and creates a GitHub Release. The twice-monthly schedule and manual runs
# only rebuild the latest tag for TestFlight so the newest build never nears the 90 day
# expiry. One workflow means one run_number counter and one concurrency group, so build
# numbers never collide and an untagged commit can never ship.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:

# No workflow-wide permissions: every job states exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HEALTH_URL: https://new-me.npc-server.top/api/health

jobs:
  # ci.yml ignores main, so without this gate a broken merge would publish untested.
  test-server:
    name: Test server (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newme
          # Per-run value: a literal would trip secret scanners on every future edit.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: newme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { echo 'These files need gofmt:'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
        env:
          TESTDB_URL: postgres://newme:ci-${{ github.run_id }}@localhost:5432/newme_test?sslmode=disable
          NEWME_APP_KEY: ci-test-key-0123456789

  test-app:
    name: Test app (Flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned exactly: "stable" moves under the pipeline and could break a release.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
      # SPM linking left check-in on a white launch screen; stay on CocoaPods.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=NEWME_APP_KEY=ci-key

  version:
    name: Compute version
    needs: [test-server, test-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute build number
        id: build
        # Expression syntax has no arithmetic, so derive one monotonic build number in shell.
        run: echo "build_number=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_OUTPUT"
      # Plain git rather than a third-party tagging action, which can break when GitHub
      # migrates its runtime. Non-push events reuse the newest tag and never create one.
      - name: Bump version and tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          if [ "$EVENT" != "push" ]; then
            if [ "$last" = "v0.0.0" ]; then
              echo "::error::No release tag exists yet; a rebuild has nothing to build."
              exit 1
            fi
            echo "tag=$last" >> "$GITHUB_OUTPUT"
            echo "version=${last#v}" >> "$GITHUB_OUTPUT"
            echo "rebuilding $last"
            exit 0
          fi
          # The first release has no tag to diff against, so read the whole history.
          if git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
            range="$last..HEAD"
          else
            range=HEAD
          fi
          log=$(git log --format='%s%n%b' "$range")
          major=$(echo "$last" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$last" | sed 's/^v//' | cut -d. -f2)
          patch=$(echo "$last" | sed 's/^v//' | cut -d. -f3)
          if echo "$log" | grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            major=$((major+1)); minor=0; patch=0
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          version="$major.$minor.$patch"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. A release for it either succeeded or was tagged by hand."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "tagged $tag (previous $last)"

  docker:
    name: Build & push server image
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./server
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/nc1107/new-me:latest
            ghcr.io/nc1107/new-me:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app-store:
    name: Build & upload iOS to TestFlight
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Rebuilds must ship the tagged commit, not whatever main has moved on to.
          ref: ${{ github.event_name != 'push' && needs.version.outputs.tag || '' }}
      - name: Require signing and app secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NEWME_APP_KEY: ${{ secrets.NEWME_APP_KEY }}
        run: |
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      ASC_API_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID NEWME_APP_KEY; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; exit 1; }
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pubcache-
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-
      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.17.0
      # pod install does not refresh the runner's CDN index, so a plugin bump pointing at a
      # newer pod fails with "version does not exist" without this.
      - name: Refresh the CocoaPods spec index
        run: pod repo update
      - name: Set up code signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$PP_PATH"))
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Build IPA
        working-directory: app
        env:
          NEWME_APP_KEY: ${{ secrets.NEWME_APP_KEY }}
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          flutter build ipa --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=NEWME_APP_KEY="$NEWME_APP_KEY"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # altool can exit 0 after printing UPLOAD FAILED, so check its output too.
        run: |
          set -o pipefail
          IPA=$(find app/build/ios -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --show-progress 2>&1 | tee altool.log
          if grep -qE "UPLOAD FAILED|Upload failed|Validation failed" altool.log; then
            echo "::error::altool reported a failed upload"
            exit 1
          fi
      # A green upload does not mean a usable build: processing can still reject it.
      - name: Wait for App Store Connect processing
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: bash scripts/asc-wait.sh

  release:
    name: GitHub Release
    needs: [version, docker, app-store]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true

  deploy-verify:
    name: Verify server deploy
    needs: [version, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      # Watchtower polls on its own interval, so wait for the live version to flip.
      - name: Poll health endpoint
        env:
          WANT: ${{ needs.version.outputs.version }}
        # Cloudflare challenges GitHub's runner IPs unless the zone skips the health
        # path (deploy/README.md), so a challenge page is inconclusive, not a failure.
        run: |
          deadline=$((SECONDS + 840))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -sS -o body --max-time 10 -w '%{http_code}' "$HEALTH_URL" || echo 000)
            if [ "$status" = 403 ] && grep -q "Just a moment" body; then
              echo "::warning::Cloudflare challenged this runner, so the live version could not be read. Add the WAF skip rule from deploy/README.md."
              exit 0
            fi
            got=$(jq -r .version body 2>/dev/null || true)
            echo "live version: ${got:-unreachable} (HTTP $status, want $WANT)"
            [ "$got" = "$WANT" ] && exit 0
            sleep 30
          done
          echo "::error::the server never reported $WANT"
          exit 1

  report-failure:
    name: Open issue on failure
    needs: [test-server, test-app, version, docker, app-store, release, deploy-verify]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release failed: ${{ github.run_number }}" \
            --body "The ${{ github.event_name }} release run failed: $RUN_URL"

  # Scheduled workflows are auto-disabled after 60 days without repository activity, which
  # would silently stop the rebuilds that keep TestFlight builds from expiring.
  keepalive:
    name: Keep schedule enabled
    if: github.event_name == 'schedule' && always()
    needs: [report-failure]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable release.yml --repo "$GITHUB_REPOSITORY"
