# New Me - Go API + Postgres 16. The Flutter app is the only client.
# Lives at ~/docker-server/npc_projects/new-me on the server. Traefik owns TLS and routes
# new-me.${DOMAIN} to the server container; watchtower (label mode) pulls new app images.

networks:
  internal:
  traefik_proxy:
    external: true
    name: traefik_proxy

volumes:
  db_data:

services:
  db:
    image: postgres:16-alpine
    container_name: new-me-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-newme}
      TZ: ${TZ:-America/New_York}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newme}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: new-me-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-newme}
      POSTGRES_USER: ${POSTGRES_USER:-newme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8081
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  server:
    image: ghcr.io/nc1107/new-me:${NEWME_TAG:-latest}
    container_name: new-me-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEWME_HTTP_ADDR: ":8080"
      NEWME_DATABASE_URL: "postgres://${POSTGRES_USER:-newme}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-newme}?sslmode=disable"
      NEWME_APP_KEY: ${NEWME_APP_KEY:?NEWME_APP_KEY must be set}
      NEWME_SERVER_NAME: ${NEWME_SERVER_NAME:-New Me}
      NEWME_TRUSTED_PROXY_HOPS: ${NEWME_TRUSTED_PROXY_HOPS:-1}
      NEWME_ABS_URL: ${NEWME_ABS_URL:-}
      NEWME_APNS_KEY: ${NEWME_APNS_KEY:-}
      NEWME_APNS_KEY_ID: ${NEWME_APNS_KEY_ID:-}
      NEWME_APNS_TEAM_ID: ${NEWME_APNS_TEAM_ID:-}
      NEWME_APNS_TOPIC: ${NEWME_APNS_TOPIC:-}
      NEWME_APNS_PRODUCTION: ${NEWME_APNS_PRODUCTION:-true}
      NEWME_ANTHROPIC_API_KEY: ${NEWME_ANTHROPIC_API_KEY:-}
      NEWME_ANTHROPIC_BASE_URL: ${NEWME_ANTHROPIC_BASE_URL:-}
      NEWME_USDA_API_KEY: ${NEWME_USDA_API_KEY:-}
      TZ: ${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - traefik_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.new-me.rule=Host(`new-me.${DOMAIN:-npc-server.top}`)"
      - "traefik.http.routers.new-me.entrypoints=websecure"
      - "traefik.http.routers.new-me.tls.certresolver=cloudflare"
      - "traefik.http.routers.new-me.middlewares=secureHeaders@file"
      - "traefik.http.services.new-me.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_proxy"
      # Auto-update the app image only, never postgres.
      - "com.centurylinklabs.watchtower.enable=true"
